name: transfer_net
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core data
      - pandas>=2.0
      - numpy>=1.24
      # Graph
      - networkx>=3.0
      # Embeddings
      - sentence-transformers>=3.0
      - transformers>=4.40
      - torch>=2.0
      # Fine-tuning
      - bitsandbytes>=0.43
      - pytorch-metric-learning>=2.3
      # Visualization
      - matplotlib>=3.7
      - plotly>=5.18
      - umap-learn>=0.5
      # Utilities
      - tqdm
      - scikit-learn>=1.3
      # Scraping
      - requests>=2.31
      - beautifulsoup4>=4.12
      - lxml>=5.0
      # IPEDS matching
      - rapidfuzz>=3.0
